{% extends 'propiedades/base.html' %}
{% block titulo %}Nueva propiedad{% endblock %}
{% block contenido %}
<div class="card shadow-sm">
  <div class="card-header bg-success text-white"><h4 class="mb-0">Registrar nueva propiedad</h4></div>
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'propiedades/_campos.html' %}
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-success">Guardar propiedad</button>
        <a href="{% url 'propiedades:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
